<?xml version="1.0" encoding="utf-8"?>
<svg width="800px" height="800px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Modern Gantt chart icon with hierarchy and timeline -->

<!-- Timeline grid background -->
<line x1="2" y1="4" x2="22" y2="4" stroke="#94A3B8" stroke-width="1.2"/>
<line x1="8" y1="4" x2="8" y2="20" stroke="#E2E8F0" stroke-width="0.8" opacity="0.5"/>
<line x1="14" y1="4" x2="14" y2="20" stroke="#E2E8F0" stroke-width="0.8" opacity="0.5"/>

<!-- Project bars with gradient effect -->
<!-- Top level - Purple (organization) -->
<defs>
  <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#9333EA;stop-opacity:0.9" />
    <stop offset="100%" style="stop-color:#7A2EC8;stop-opacity:1" />
  </linearGradient>
  <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#FB923C;stop-opacity:0.9" />
    <stop offset="100%" style="stop-color:#F97316;stop-opacity:1" />
  </linearGradient>
  <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#4ADE80;stop-opacity:0.9" />
    <stop offset="100%" style="stop-color:#22C55E;stop-opacity:1" />
  </linearGradient>
</defs>

<!-- Bar 1 - Organization level -->
<rect x="3" y="6" width="13" height="3" rx="1.5" fill="url(#purpleGrad)"/>
<circle cx="4.5" cy="7.5" r="0.9" fill="#F8FAFC" stroke="#7A2EC8" stroke-width="0.5"/>

<!-- Bar 2 - Epic level (indented) -->
<rect x="5" y="10.5" width="11" height="3" rx="1.5" fill="url(#orangeGrad)"/>
<circle cx="6.5" cy="12" r="0.9" fill="#F8FAFC" stroke="#F97316" stroke-width="0.5"/>

<!-- Bar 3 - Story level (more indented) -->
<rect x="7" y="15" width="8" height="3" rx="1.5" fill="url(#greenGrad)"/>
<circle cx="8.5" cy="16.5" r="0.9" fill="#F8FAFC" stroke="#22C55E" stroke-width="0.5"/>

<!-- Current time indicator -->
<line x1="11" y1="4" x2="11" y2="19" stroke="#7A2EC8" stroke-width="1.5" stroke-dasharray="1.5,1.5" opacity="0.7"/>
<circle cx="11" cy="3.5" r="1.2" fill="#7A2EC8"/>
</svg>
