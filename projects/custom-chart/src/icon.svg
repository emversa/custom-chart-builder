<?xml version="1.0" encoding="utf-8"?>
<svg width="800px" height="800px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Gantt chart icon representing project timeline -->
<!-- Timeline header -->
<line x1="3" y1="5" x2="21" y2="5" stroke="#33363F" stroke-width="1.5"/>
<!-- Vertical dividers for time periods -->
<line x1="9" y1="5" x2="9" y2="20" stroke="#CBD5E1" stroke-width="0.5"/>
<line x1="15" y1="5" x2="15" y2="20" stroke="#CBD5E1" stroke-width="0.5"/>
<!-- Project bar 1 (organization level - purple) -->
<rect x="3" y="7" width="12" height="2.5" rx="1" fill="#A78BFA" opacity="0.8"/>
<circle cx="4.5" cy="8.25" r="0.8" fill="#4ADE80"/>
<!-- Project bar 2 (epic level - orange) -->
<rect x="6" y="11" width="10" height="2.5" rx="1" fill="#FB923C" opacity="0.8"/>
<circle cx="7.5" cy="12.25" r="0.8" fill="#FB923C"/>
<!-- Project bar 3 (story level - green) -->
<rect x="8" y="15" width="6" height="2.5" rx="1" fill="#4ADE80" opacity="0.8"/>
<circle cx="9.5" cy="16.25" r="0.8" fill="#60A5FA"/>
<!-- Today indicator line -->
<line x1="12" y1="5" x2="12" y2="20" stroke="#6366F1" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
</svg>
